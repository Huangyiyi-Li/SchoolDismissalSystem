name: Diagnose real Windows TTS
on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-voice-repeat
permissions:
  contents: read
jobs:
  tts:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/probe_windows_tts.py tts-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tts-evidence
          path: tts-evidence
