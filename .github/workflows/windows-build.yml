name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - codex/2.0-upgrade
      - codex/android-dismissal-remote-test
      - codex/offline-tts
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 8 for ONBON LED bridge
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read application metadata
        id: app_info
        shell: pwsh
        run: |
          $version = python -c "from src.app_info import APP_VERSION; print(APP_VERSION)"
          $zipName = python -c "from src.app_info import WINDOWS_ZIP_NAME; print(WINDOWS_ZIP_NAME)"
          $shaName = python -c "from src.app_info import WINDOWS_SHA256_NAME; print(WINDOWS_SHA256_NAME)"
          $setupName = python -c "from src.app_info import WINDOWS_SETUP_NAME; print(WINDOWS_SETUP_NAME)"
          $setupShaName = python -c "from src.app_info import WINDOWS_SETUP_SHA256_NAME; print(WINDOWS_SETUP_SHA256_NAME)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha_name=$shaName" >> $env:GITHUB_OUTPUT
          "setup_name=$setupName" >> $env:GITHUB_OUTPUT
          "setup_sha_name=$setupShaName" >> $env:GITHUB_OUTPUT

      - name: Run Windows client tests
        shell: pwsh
        run: |
          python -m pytest -q tests

      - name: Download offline Mandarin voice
        shell: pwsh
        run: |
          $modelDir = "offline-tts\vits-melo-tts-zh_en"
          New-Item -ItemType Directory -Force $modelDir | Out-Null
          $base = "https://huggingface.co/csukuangfj/vits-melo-tts-zh_en/resolve/main"
          foreach ($name in @("model.int8.onnx", "lexicon.txt", "tokens.txt", "date.fst", "number.fst", "LICENSE")) {
            Invoke-WebRequest "$base/$name" -OutFile "$modelDir\$name"
            if (!(Test-Path "$modelDir\$name")) { throw "Voice asset missing: $name" }
          }
          $actual = (Get-FileHash "$modelDir\model.int8.onnx" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "f085f5079e05f039b800aeb542f5253c26a303211b0c6465d0d9387977855a63") {
            throw "Offline Mandarin voice checksum mismatch: $actual"
          }

      - name: Verify offline Mandarin synthesis
        run: python tools/probe_offline_tts.py

      - name: Verify tag matches client version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.app_info.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Git tag ${{ github.ref_name }} does not match client version $expectedTag"
          }

      - name: Build ONBON Java LED bridge
        shell: pwsh
        run: |
          python tools/build_led_bridge.py
          if ($LASTEXITCODE -ne 0) {
            throw "ONBON Java bridge build failed with exit code $LASTEXITCODE"
          }
          if (!(Test-Path "led-bridge\led-bridge.jar")) {
            throw "ONBON Java bridge build produced no led-bridge.jar"
          }

      - name: Build executable and release files
        shell: pwsh
        run: |
          Copy-Item -Recurse "$env:JAVA_HOME\jre" "led-bridge\runtime"
          if (Test-Path "$env:JAVA_HOME\LICENSE") {
            Copy-Item "$env:JAVA_HOME\LICENSE" "led-bridge\runtime\LICENSE"
          }
          python build_exe.py

      - name: Verify packaged offline voice
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist\${{ steps.app_info.outputs.zip_name }}" -DestinationPath "dist\packaged-test"
          $exe = (Resolve-Path "dist\packaged-test\数智家校放学系统.exe").Path
          $output = Join-Path (Resolve-Path "dist").Path "tts-packaged.wav"
          $process = Start-Process -FilePath $exe -ArgumentList "--tts-self-test `"$output`"" -WorkingDirectory (Get-Location).Path -Wait -PassThru
          if (Test-Path "dist\tts-packaged.error.txt") { Get-Content "dist\tts-packaged.error.txt" }
          if ($process.ExitCode -ne 0) { throw "Packaged offline voice failed: $($process.ExitCode)" }
          python -c "import wave; w=wave.open(r'dist\tts-packaged.wav'); assert w.getnframes()/w.getframerate()>0.5"

      - name: Build current-user Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          $setupName = "${{ steps.app_info.outputs.setup_name }}"
          $setupBaseName = [IO.Path]::GetFileNameWithoutExtension($setupName)
          & $iscc "/DMyAppVersion=${{ steps.app_info.outputs.version }}" "/DMySetupBaseName=$setupBaseName" "installer\windows-installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed with exit code $LASTEXITCODE"
          }
          $setupPath = "dist\$setupName"
          if (!(Test-Path $setupPath)) {
            throw "Windows installer was not generated: $setupPath"
          }
          $hash = (Get-FileHash $setupPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $setupName" | Set-Content "dist\${{ steps.app_info.outputs.setup_sha_name }}" -Encoding utf8

      - name: Upload Windows build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 数智家校放学系统-v${{ steps.app_info.outputs.version }}-windows-x64
          path: |
            dist/数智家校放学系统.exe
            dist/${{ steps.app_info.outputs.zip_name }}
            dist/${{ steps.app_info.outputs.sha_name }}
            dist/${{ steps.app_info.outputs.setup_name }}
            dist/${{ steps.app_info.outputs.setup_sha_name }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish branch beta pre-release
        if: ${{ github.ref == 'refs/heads/codex/android-dismissal-remote-test' && contains(steps.app_info.outputs.version, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.app_info.outputs.version }}"
          $notes = Get-Content "release-notes/$tag.md" -Raw
          $notes = $notes.Replace("{{COMMIT_SHA}}", "${{ github.sha }}")
          Set-Content "dist/release-notes.md" $notes -Encoding utf8
          gh release delete "$tag" --yes --cleanup-tag 2>$null
          gh release create "$tag" `
            "dist/${{ steps.app_info.outputs.zip_name }}" `
            "dist/${{ steps.app_info.outputs.sha_name }}" `
            "dist/${{ steps.app_info.outputs.setup_name }}" `
            "dist/${{ steps.app_info.outputs.setup_sha_name }}" `
            --target "${{ github.sha }}" `
            --title "$tag" `
            --notes-file "dist/release-notes.md" `
            --prerelease

      - name: Prepare checksums for Release download names
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          python -m tools.prepare_release_checksums
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to prepare Release checksums"
          }

      - name: Publish GitHub pre-release
        if: ${{ startsWith(github.ref, 'refs/tags/') && contains(steps.app_info.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = Get-Content "release-notes/${{ github.ref_name }}.md" -Raw
          $notes = $notes.Replace("{{COMMIT_SHA}}", "${{ github.sha }}")
          Set-Content "dist/release-notes.md" $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" `
            "dist/${{ steps.app_info.outputs.zip_name }}" `
            "dist/${{ steps.app_info.outputs.sha_name }}" `
            "dist/${{ steps.app_info.outputs.setup_name }}" `
            "dist/${{ steps.app_info.outputs.setup_sha_name }}" `
            --title "${{ github.ref_name }}" `
            --notes-file "dist/release-notes.md" `
            --prerelease

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(steps.app_info.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = Get-Content "release-notes/${{ github.ref_name }}.md" -Raw
          $notes = $notes.Replace("{{COMMIT_SHA}}", "${{ github.sha }}")
          Set-Content "dist/release-notes.md" $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" `
            "dist/${{ steps.app_info.outputs.zip_name }}" `
            "dist/${{ steps.app_info.outputs.sha_name }}" `
            "dist/${{ steps.app_info.outputs.setup_name }}" `
            "dist/${{ steps.app_info.outputs.setup_sha_name }}" `
            --title "${{ github.ref_name }}" `
            --notes-file "dist/release-notes.md"

      - name: Set release asset names and Chinese labels
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zipPath = Get-ChildItem "dist" -Filter "*-windows-x64.zip" | Select-Object -First 1
          $shaPath = Get-ChildItem "dist" -Filter "*-windows-x64.zip.sha256" | Select-Object -First 1
          $setupPath = Get-ChildItem "dist" -Filter "*-setup-x64.exe" | Select-Object -First 1
          $setupShaPath = Get-ChildItem "dist" -Filter "*-setup-x64.exe.sha256" | Select-Object -First 1
          $release = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
          $zipAsset = $release.assets | Where-Object { $_.name.EndsWith(".zip") } | Select-Object -First 1
          $shaAsset = $release.assets | Where-Object { $_.name.EndsWith(".zip.sha256") } | Select-Object -First 1
          $setupAsset = $release.assets | Where-Object { $_.name.EndsWith("-setup-x64.exe") } | Select-Object -First 1
          $setupShaAsset = $release.assets | Where-Object { $_.name.EndsWith("-setup-x64.exe.sha256") } | Select-Object -First 1
          $zipDownloadName = "school-dismissal-v${{ steps.app_info.outputs.version }}-windows-x64.zip"
          $shaDownloadName = "$zipDownloadName.sha256"
          $setupDownloadName = "school-dismissal-v${{ steps.app_info.outputs.version }}-setup-x64.exe"
          $setupShaDownloadName = "$setupDownloadName.sha256"
          gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$($zipAsset.id)" `
            -f "name=$zipDownloadName" `
            -f "label=$($zipPath.Name)"
          gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$($shaAsset.id)" `
            -f "name=$shaDownloadName" `
            -f "label=$($shaPath.Name)"
          gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$($setupAsset.id)" `
            -f "name=$setupDownloadName" `
            -f "label=$($setupPath.Name)"
          gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$($setupShaAsset.id)" `
            -f "name=$setupShaDownloadName" `
            -f "label=$($setupShaPath.Name)"
